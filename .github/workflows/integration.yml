name: Integration

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  integration-gate:
    name: Integration Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          node --input-type=module --check < site/app.js
          node --check site/registry-query.js
          node --check site/sw.js
          node --check scripts/base-profile.mjs
          node --check scripts/check-public-release.mjs
          node --check scripts/commerce-profile.mjs
          node --check scripts/design-registry.mjs
          node --check scripts/dev.mjs
          node --check scripts/graph-profile.mjs

      - name: Check public release contents
        run: node scripts/check-public-release.mjs
